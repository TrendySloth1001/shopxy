name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
  merchant-web:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder; the BFF only talks to the real backend at runtime.
      API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: merchant-web/package-lock.json }
      - working-directory: merchant-web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
  customer-web:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder; the BFF only talks to the real backend at runtime.
      API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: customer-web/package-lock.json }
      - working-directory: customer-web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: customer
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
