name: shopxy_customer
description: "Shopxy — the customer-side companion. Accept invites from shops and view your invoices."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^6.2.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  figma_squircle: ^0.6.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  share_plus: ^12.0.2
  app_links: ^7.0.0
  path_provider: ^2.1.5
  cross_file: ^0.3.5+2
  image_picker: ^1.1.2
  # Online payments — opens the Razorpay Checkout sheet at checkout. Native
  # plugin: after adding, run `flutter pub get` and ensure Android
  # minSdkVersion >= 21 (android/app/build.gradle). See PAYMENTS_SETUP.md.
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
